name: Vibe Capsule hosted phone checks
on:
  push:
    branches: ['native/vibe-capsule-netlify-test']
permissions:
  contents: read
concurrency:
  group: hosted-phone-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux-check:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install existing editor and hosting libraries
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Build phone editor and native video tools
        run: npm run build:hosted
      - name: Verify hosted jobs, storage, protected previews and local-phone regression
        run: node --import tsx --test tests/cloud-server.test.ts tests/cloud-storage-adapter.test.ts tests/cloud-retention.test.ts tests/phone-client.test.ts tests/mobile-server.test.ts
