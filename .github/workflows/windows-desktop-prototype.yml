name: Concert Compass Windows prototype verification
on:
  push:
    branches: ['native/windows-desktop-prototype']
permissions:
  contents: read
jobs:
  windows-test:
    if: github.event.repository.private == false
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install prototype dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Build desktop app
        run: npm run build
      - name: Test synthetic media export
        run: npm test
      - name: Test five-minute compilation and long source
        run: npx tsx tools/long-render.ts
      - name: Package the Windows application
        run: npm run package:win -- "$env:RUNNER_TEMP\compass-package"
      - name: Open desktop window and check bridge
        shell: pwsh
        run: |
          $env:COMPASS_SMOKE_TEST = '1'
          $env:COMPASS_SMOKE_INPUT = "$env:RUNNER_TEMP\compass-synthetic-input.mov"
          $env:COMPASS_SMOKE_SECOND = "$env:RUNNER_TEMP\compass-second.mp4"
          $env:COMPASS_SMOKE_OUTPUT = "$env:RUNNER_TEMP\compass-synthetic-output.mp4"
          & '.\node_modules\ffmpeg-static\ffmpeg.exe' -hide_banner -loglevel error -y -f lavfi -i 'testsrc2=size=320x240:rate=30:duration=3' -f lavfi -i 'sine=frequency=440:sample_rate=48000:duration=3' -c:v libx265 -x265-params 'pools=1:log-level=error' -tag:v hvc1 -c:a aac $env:COMPASS_SMOKE_INPUT
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic fixture generation failed.' }
          & '.\node_modules\ffmpeg-static\ffmpeg.exe' -hide_banner -loglevel error -y -f lavfi -i 'color=red:size=320x240:rate=30:duration=3' -f lavfi -i 'sine=frequency=660:sample_rate=48000:duration=3' -c:v libx264 -c:a aac $env:COMPASS_SMOKE_SECOND
          if ($LASTEXITCODE -ne 0) { throw 'Second synthetic fixture generation failed.' }
          $process = Start-Process -FilePath "$env:RUNNER_TEMP\compass-package\Concert Compass-win32-x64\Concert Compass.exe" -PassThru -WindowStyle Hidden -RedirectStandardOutput "$env:RUNNER_TEMP\compass-stdout.log" -RedirectStandardError "$env:RUNNER_TEMP\compass-stderr.log"
          if (-not $process.WaitForExit(110000)) { Stop-Process -Id $process.Id -Force; throw 'Desktop app timed out.' }
          Get-Content "$env:RUNNER_TEMP\compass-stdout.log" -ErrorAction SilentlyContinue
          Get-Content "$env:RUNNER_TEMP\compass-stderr.log" -ErrorAction SilentlyContinue
          if ($process.ExitCode -ne 0) {
            Get-Content "$env:RUNNER_TEMP\compass-stderr.log" -ErrorAction SilentlyContinue | ForEach-Object { Write-Output "::error::$($_ -replace '%','%25')" }
            throw "Desktop app failed with exit code $($process.ExitCode)."
          }
