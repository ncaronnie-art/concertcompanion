name: Concert Compass Windows prototype verification
on:
  push:
    branches: ['native/windows-desktop-prototype', 'native/vibe-capsule-polish', 'native/vibe-capsule-audio-story', 'native/vibe-capsule-visual-finish', 'native/vibe-capsule-desktop-quality', 'native/vibe-capsule-smooth-reels', 'native/vibe-capsule-music-led', 'native/vibe-capsule-three-act-audio', 'native/vibe-capsule-crowd-check', 'native/vibe-capsule-y2k-visuals', 'native/vibe-capsule-body-neon']
permissions:
  contents: read
jobs:
  windows-test:
    if: github.event.repository.private == false
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install prototype dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Build desktop app
        run: npm run build
      - name: Test synthetic media export
        run: npm test
      - name: Test five-minute compilation and long source
        run: npx tsx tools/long-render.ts
      - name: Package the Windows application
        run: npm run package:win -- "$env:RUNNER_TEMP\compass-package"
      - name: Open desktop window and check bridge
        id: desktop_smoke
        shell: pwsh
        run: |
          $env:COMPASS_SMOKE_TEST = '1'
          $env:COMPASS_SMOKE_CLEANUP_FAIL = '1'
          $env:COMPASS_SMOKE_INPUT = "$env:RUNNER_TEMP\compass-synthetic-input.mov"
          $env:COMPASS_SMOKE_SECOND = "$env:RUNNER_TEMP\compass-second.mp4"
          $env:COMPASS_SMOKE_OUTPUT = "$env:RUNNER_TEMP\compass-synthetic-output.mp4"
          $env:COMPASS_SMOKE_PROJECT = "$env:RUNNER_TEMP\compass-synthetic-project.json"
          $env:COMPASS_SMOKE_STAGE_FILE = "$env:RUNNER_TEMP\compass-stages.log"
          & '.\node_modules\ffmpeg-static\ffmpeg.exe' -hide_banner -loglevel error -y -f lavfi -i 'color=green:size=320x240:rate=30:duration=3' -f lavfi -i 'sine=frequency=440:sample_rate=48000:duration=3' -c:v libx265 -x265-params 'pools=1:log-level=error' -tag:v hvc1 -c:a aac $env:COMPASS_SMOKE_INPUT
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic fixture generation failed.' }
          # Red center with blue sides makes a filled portrait crop visibly distinct from a blurred whole-frame fit.
          & '.\node_modules\ffmpeg-static\ffmpeg.exe' -hide_banner -loglevel error -y -f lavfi -i 'color=blue:size=320x240:rate=30:duration=3' -f lavfi -i 'sine=frequency=660:sample_rate=48000:duration=3' -vf 'drawbox=x=45:y=0:w=230:h=240:color=red:t=fill' -c:v libx264 -c:a aac $env:COMPASS_SMOKE_SECOND
          if ($LASTEXITCODE -ne 0) { throw 'Second synthetic fixture generation failed.' }
          $process = Start-Process -FilePath "$env:RUNNER_TEMP\compass-package\Concert Compass-win32-x64\Concert Compass.exe" -PassThru -WindowStyle Hidden -RedirectStandardOutput "$env:RUNNER_TEMP\compass-stdout.log" -RedirectStandardError "$env:RUNNER_TEMP\compass-stderr.log"
          $finished = $process.WaitForExit(390000)
          $stages = @(Get-Content "$env:RUNNER_TEMP\compass-stages.log" -ErrorAction SilentlyContinue)
          $failure = $stages | Where-Object { $_ -match 'desktop smoke test failed:' } | Select-Object -Last 1
          $diagnosis = if ($failure) { $failure } elseif ($stages.Count) { $stages[-1] } else { 'no desktop stage recorded' }
          $diagnosis = $diagnosis.Substring(0, [Math]::Min(170, $diagnosis.Length)) -replace '[\r\n|]', ' '
          "diagnosis=$diagnosis" | Add-Content -Path $env:GITHUB_OUTPUT
          $stages | ForEach-Object { Write-Output $_ }
          "### Desktop test stages" | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          if ($stages.Count -eq 0) { "- No stage was recorded." | Add-Content -Path $env:GITHUB_STEP_SUMMARY }
          else { $stages | ForEach-Object { "- $_" | Add-Content -Path $env:GITHUB_STEP_SUMMARY } }
          "- Process exit: $($process.ExitCode)" | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          Get-Content "$env:RUNNER_TEMP\compass-stdout.log" -ErrorAction SilentlyContinue
          Get-Content "$env:RUNNER_TEMP\compass-stderr.log" -ErrorAction SilentlyContinue
          if (-not $finished) { Stop-Process -Id $process.Id -Force; throw 'Desktop app timed out.' }
          if ($process.ExitCode -ne 0) {
            Get-Content "$env:RUNNER_TEMP\compass-stderr.log" -ErrorAction SilentlyContinue | ForEach-Object { Write-Output "::error::$($_ -replace '%','%25')" }
            throw "Desktop app failed with exit code $($process.ExitCode)."
          }
      - name: Desktop result ${{ steps.desktop_smoke.outputs.diagnosis }}
        if: always()
        shell: pwsh
        run: Write-Output 'Desktop test result recorded.'
      - name: Check desktop page loaded
        if: always()
        shell: pwsh
        run: |
          if (-not (Select-String -Path "$env:RUNNER_TEMP\compass-stages.log" -Pattern 'page loaded' -Quiet -ErrorAction SilentlyContinue)) { throw 'Desktop page did not load.' }
      - name: Check video import completed
        if: always()
        shell: pwsh
        run: |
          if (-not (Select-String -Path "$env:RUNNER_TEMP\compass-stages.log" -Pattern 'videos imported' -Quiet -ErrorAction SilentlyContinue)) { throw 'Video import did not complete.' }
      - name: Check source picture decoded
        if: always()
        shell: pwsh
        run: |
          if (-not (Select-String -Path "$env:RUNNER_TEMP\compass-stages.log" -Pattern 'source picture ready' -Quiet -ErrorAction SilentlyContinue)) { throw 'Source picture was not ready.' }
      - name: Check fresh phone finishing defaults
        if: always() && steps.desktop_smoke.outcome != 'skipped'
        shell: pwsh
        run: |
          if (-not (Select-String -Path "$env:RUNNER_TEMP\compass-stages.log" -Pattern 'fresh phone finishing defaults ready' -SimpleMatch -Quiet -ErrorAction SilentlyContinue)) { throw 'Fresh phone shape, quality, transitions, or text defaults were not confirmed.' }
      - name: Check bundled local sound classifier
        if: always() && steps.desktop_smoke.outcome != 'skipped'
        shell: pwsh
        run: |
          if (-not (Select-String -Path "$env:RUNNER_TEMP\compass-stages.log" -Pattern 'local sound classifier ready' -SimpleMatch -Quiet -ErrorAction SilentlyContinue)) { throw 'The packaged local audio model did not return validated singing, music, crowd and speech scores.' }
      - name: Check creative brief and first cut
        if: always()
        shell: pwsh
        run: |
          if (-not (Select-String -Path "$env:RUNNER_TEMP\compass-stages.log" -Pattern 'first cut planned' -Quiet -ErrorAction SilentlyContinue)) { throw 'First cut was not planned.' }
      - name: Check assembled draft picture
        if: always()
        shell: pwsh
        run: |
          if (-not (Select-String -Path "$env:RUNNER_TEMP\compass-stages.log" -Pattern 'draft picture ready' -Quiet -ErrorAction SilentlyContinue)) { throw 'Assembled draft picture was not ready.' }
      - name: Check title and named moments in the draft
        if: always()
        shell: pwsh
        run: |
          $stages = "$env:RUNNER_TEMP\compass-stages.log"
          foreach ($stage in @('visual brief options ready', 'visual draft overlay ready')) {
            if (-not (Select-String -Path $stages -Pattern $stage -SimpleMatch -Quiet -ErrorAction SilentlyContinue)) { throw "Visual draft check did not finish: $stage" }
          }
      - name: Check portrait crop and saved focus
        if: always()
        shell: pwsh
        run: |
          $stages = "$env:RUNNER_TEMP\compass-stages.log"
          foreach ($stage in @('portrait 9:13 legacy profile ready', 'landscape source filled portrait frame', 'portrait aim changed rendered picture', 'portrait aim survived project reopen')) {
            if (-not (Select-String -Path $stages -Pattern $stage -SimpleMatch -Quiet -ErrorAction SilentlyContinue)) { throw "Portrait framing check did not finish: $stage" }
          }
      - name: Check project save and export
        if: always()
        shell: pwsh
        run: |
          if (-not (Select-String -Path "$env:RUNNER_TEMP\compass-stages.log" -Pattern 'export completed' -Quiet -ErrorAction SilentlyContinue)) { throw 'Project save or export did not complete.' }
      - name: Check saved visual choices and exported title
        if: always()
        shell: pwsh
        run: |
          $stages = "$env:RUNNER_TEMP\compass-stages.log"
          foreach ($stage in @('visual options survived project reopen', 'visual exported overlay ready')) {
            if (-not (Select-String -Path $stages -Pattern $stage -SimpleMatch -Quiet -ErrorAction SilentlyContinue)) { throw "Visual export check did not finish: $stage" }
          }
      - name: Check full creative workflow
        if: always()
        shell: pwsh
        run: |
          if (-not (Select-String -Path "$env:RUNNER_TEMP\compass-stages.log" -Pattern 'smoke passed' -Quiet -ErrorAction SilentlyContinue)) { throw 'Full creative workflow did not complete.' }
      - name: Check finishing controls undo and project reopen
        if: always() && steps.desktop_smoke.outcome != 'skipped'
        shell: pwsh
        run: |
          foreach ($stage in @('music preferences undo restored', 'finishing controls undo restored', 'finishing controls survived project reopen')) {
            if (-not (Select-String -Path "$env:RUNNER_TEMP\compass-stages.log" -Pattern $stage -SimpleMatch -Quiet -ErrorAction SilentlyContinue)) { throw "Finishing settings check did not finish: $stage" }
          }
      - name: Check performer neon controls preserve the edit
        if: always() && steps.desktop_smoke.outcome != 'skipped'
        shell: pwsh
        run: |
          foreach ($stage in @('body outline options and undo ready', 'signature settings preserved sections and audio', 'signature project reopened', 'per-recording neon correction saved reopened and undone', 'legacy project kept body neon off')) {
            if (-not (Select-String -Path "$env:RUNNER_TEMP\compass-stages.log" -Pattern $stage -SimpleMatch -Quiet -ErrorAction SilentlyContinue)) { throw "Performer neon UI check did not finish: $stage" }
          }
      - name: Check bundled native silhouette model in Electron
        if: always() && steps.desktop_smoke.outcome != 'skipped'
        shell: pwsh
        run: |
          if (-not (Select-String -Path "$env:RUNNER_TEMP\compass-stages.log" -Pattern 'packaged native silhouette model ready' -SimpleMatch -Quiet -ErrorAction SilentlyContinue)) { throw 'The bundled CPU silhouette model did not run inside packaged Electron.' }
      - name: Open sound-led desktop flow
        id: sound_story
        shell: pwsh
        run: |
          $env:COMPASS_SMOKE_TEST = '1'
          $env:COMPASS_SMOKE_STORY = '1'
          $env:COMPASS_SMOKE_INPUT = "$env:RUNNER_TEMP\story-red.mp4"
          $env:COMPASS_SMOKE_SECOND = "$env:RUNNER_TEMP\story-blue.mp4"
          $env:COMPASS_SMOKE_THIRD = "$env:RUNNER_TEMP\story-yellow.mp4"
          $env:COMPASS_SMOKE_OUTPUT = "$env:RUNNER_TEMP\story-output.mp4"
          $env:COMPASS_SMOKE_PROJECT = "$env:RUNNER_TEMP\story-project.json"
          $env:COMPASS_SMOKE_STAGE_FILE = "$env:RUNNER_TEMP\story-stages.log"
          & '.\node_modules\ffmpeg-static\ffmpeg.exe' -hide_banner -loglevel error -y -f lavfi -i 'color=c=red:size=320x240:rate=30:duration=8' -f lavfi -i 'sine=frequency=220:sample_rate=48000:duration=8' -af 'volume=0.4' -c:v libx264 -preset ultrafast -c:a aac $env:COMPASS_SMOKE_INPUT
          if ($LASTEXITCODE -ne 0) { throw 'First sound-story fixture failed.' }
          & '.\node_modules\ffmpeg-static\ffmpeg.exe' -hide_banner -loglevel error -y -f lavfi -i 'color=c=blue:size=320x240:rate=30:duration=8' -f lavfi -i 'sine=frequency=440:sample_rate=48000:duration=8' -af 'volume=0.8' -c:v libx264 -preset ultrafast -c:a aac $env:COMPASS_SMOKE_SECOND
          if ($LASTEXITCODE -ne 0) { throw 'Second sound-story fixture failed.' }
          & '.\node_modules\ffmpeg-static\ffmpeg.exe' -hide_banner -loglevel error -y -f lavfi -i 'color=c=yellow:size=320x240:rate=30:duration=8' -f lavfi -i 'sine=frequency=660:sample_rate=48000:duration=8' -af 'volume=1.6' -c:v libx264 -preset ultrafast -c:a aac $env:COMPASS_SMOKE_THIRD
          if ($LASTEXITCODE -ne 0) { throw 'Third sound-story fixture failed.' }
          $process = Start-Process -FilePath "$env:RUNNER_TEMP\compass-package\Concert Compass-win32-x64\Concert Compass.exe" -PassThru -WindowStyle Hidden -RedirectStandardOutput "$env:RUNNER_TEMP\story-stdout.log" -RedirectStandardError "$env:RUNNER_TEMP\story-stderr.log"
          $finished = $process.WaitForExit(170000)
          $stages = @(Get-Content "$env:RUNNER_TEMP\story-stages.log" -ErrorAction SilentlyContinue)
          $stages | ForEach-Object { Write-Output $_ }
          "### Three-part soundtrack desktop test" | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          if ($stages.Count -eq 0) { "- No stage was recorded." | Add-Content -Path $env:GITHUB_STEP_SUMMARY }
          else { $stages | ForEach-Object { "- $_" | Add-Content -Path $env:GITHUB_STEP_SUMMARY } }
          "- Process exit: $($process.ExitCode)" | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          Get-Content "$env:RUNNER_TEMP\story-stdout.log" -ErrorAction SilentlyContinue
          Get-Content "$env:RUNNER_TEMP\story-stderr.log" -ErrorAction SilentlyContinue
          if (-not $finished) { Stop-Process -Id $process.Id -Force; throw 'Sound-led desktop app timed out.' }
          if ($process.ExitCode -ne 0) {
            $failure = $stages | Where-Object { $_ -match 'desktop smoke test failed:' } | Select-Object -Last 1
            if ($failure) {
              $escaped = $failure -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
              Write-Output "::error title=Sound-led desktop failure::$escaped"
            }
            throw "Sound-led desktop app failed with exit code $($process.ExitCode)."
          }
      - name: Check sound-led brief
        if: always() && steps.sound_story.outcome != 'skipped'
        shell: pwsh
        run: |
          if (-not (Select-String -Path "$env:RUNNER_TEMP\story-stages.log" -Pattern 'story brief reviewed' -Quiet -ErrorAction SilentlyContinue)) { throw 'Soundtrack and picture plan was not confirmed.' }
      - name: Check sound-led first cut
        if: always() && steps.sound_story.outcome != 'skipped'
        shell: pwsh
        run: |
          if (-not (Select-String -Path "$env:RUNNER_TEMP\story-stages.log" -Pattern 'story first cut planned' -Quiet -ErrorAction SilentlyContinue)) { throw 'Three sound moments and picture sources were not selected.' }
      - name: Check three sound moments and draft
        if: always() && steps.sound_story.outcome != 'skipped'
        shell: pwsh
        run: |
          if (-not (Select-String -Path "$env:RUNNER_TEMP\story-stages.log" -Pattern 'story draft picture ready' -Quiet -ErrorAction SilentlyContinue)) { throw 'Three sound moments or assembled draft did not complete.' }
      - name: Check sound adjustment and project reopen
        if: always() && steps.sound_story.outcome != 'skipped'
        shell: pwsh
        run: |
          if (-not (Select-String -Path "$env:RUNNER_TEMP\story-stages.log" -Pattern 'story project reopened' -Quiet -ErrorAction SilentlyContinue)) { throw 'Sound adjustment or saved project reopen did not complete.' }
      - name: Check sound-led MP4 export
        if: always() && steps.sound_story.outcome != 'skipped'
        shell: pwsh
        run: |
          if (-not (Select-String -Path "$env:RUNNER_TEMP\story-stages.log" -Pattern 'story smoke passed' -Quiet -ErrorAction SilentlyContinue)) { throw 'Sound-led export or full desktop flow did not complete.' }
          if (-not (Select-String -Path "$env:RUNNER_TEMP\story-stages.log" -Pattern 'story title exported' -Quiet -ErrorAction SilentlyContinue)) { throw 'Sound-led title was not visible in the exported picture.' }
      - name: Check automatic sound review and interruption override
        if: always() && steps.sound_story.outcome != 'skipped'
        shell: pwsh
        run: |
          if (-not (Select-String -Path "$env:RUNNER_TEMP\compass-stages.log" -Pattern 'automatic standard sound review ready' -SimpleMatch -Quiet -ErrorAction SilentlyContinue)) { throw 'Standard selections were not checked automatically.' }
          foreach ($stage in @('automatic soundtrack review ready', 'interruption warning reviewed before export', 'reviewed sound export completed')) {
            if (-not (Select-String -Path "$env:RUNNER_TEMP\story-stages.log" -Pattern $stage -SimpleMatch -Quiet -ErrorAction SilentlyContinue)) { throw "Automatic sound review did not finish: $stage" }
          }
